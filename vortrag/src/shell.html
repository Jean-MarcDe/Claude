<div class="deck-viewport">

<div class="help ui" id="help">

  <div><b>←</b> zurück</div>
  <div><b>↓ ↑</b> Folie vor / zurück ohne Schritte</div>
  <div><b>Pos1 Ende</b> erste / letzte Folie</div>
  <div><b>O</b> Übersicht aller Folien</div>
  <div><b>F</b> Vollbild</div>
  <div><b>E</b> Texte bearbeiten, Strg/Cmd+S exportiert</div>
  <div><b>? H</b> diese Hilfe</div>
</div>
<div class="edit-hotzone ui"></div>
<button class="edit-toggle ui" id="editToggle" title="Edit-Modus (E)">EDIT</button>
